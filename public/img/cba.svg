<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Association Rules Grid (Rubric Matrix) -->
  <!-- Outer border -->
  <rect x="18" y="18" width="64" height="64" rx="6" fill="#f8fafc" stroke="#f97316" stroke-width="3"/>
  
  <!-- Grid dividers -->
  <line x1="39" y1="18" x2="39" y2="82" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="18" x2="60" y2="82" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="18" y1="39" x2="82" y2="39" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="18" y1="60" x2="82" y2="60" stroke="#cbd5e1" stroke-width="2"/>

  <!-- High-Confidence Rule Tile (Top Right: Teal Pass) -->
  <rect x="61" y="19" width="20" height="19" fill="#0d9488" fill-opacity="0.25"/>
  <circle cx="71" cy="28" r="4" fill="#0d9488"/>

  <!-- High-Confidence Rule Tile (Bottom Left: Rose Risk) -->
  <rect x="19" y="61" width="19" height="20" fill="#e11d48" fill-opacity="0.25"/>
  <circle cx="28" cy="71" r="4" fill="#e11d48"/>

  <!-- Center Rule Arrow Indicator -->
  <path d="M 46 50 L 54 50 M 50 46 L 54 50 L 50 54" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
