<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gaussian Bell Curves for Naive Bayes -->
  <line x1="10" y1="85" x2="90" y2="85" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <!-- Class 1 Bell Curve -->
  <path d="M 12 85 C 20 85, 25 30, 35 30 C 45 30, 50 85, 58 85" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <!-- Class 2 Bell Curve -->
  <path d="M 42 85 C 50 85, 55 40, 65 40 C 75 40, 80 85, 88 85" fill="none" stroke="#9900D8" stroke-width="5" stroke-linecap="round"/>
  <!-- Intersection line -->
  <line x1="50" y1="20" x2="50" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
