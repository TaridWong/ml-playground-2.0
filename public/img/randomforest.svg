<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Multiple Trees for Random Forest -->
  <!-- Left Tree -->
  <circle cx="28" cy="22" r="5" fill="#0D9488"/>
  <line x1="28" y1="27" x2="20" y2="45" stroke="#0D9488" stroke-width="3"/>
  <line x1="28" y1="27" x2="36" y2="45" stroke="#0D9488" stroke-width="3"/>
  <circle cx="20" cy="48" r="4" fill="#0D9488"/>
  <circle cx="36" cy="48" r="4" fill="#0D9488"/>

  <!-- Right Tree -->
  <circle cx="72" cy="22" r="5" fill="#0D9488"/>
  <line x1="72" y1="27" x2="64" y2="45" stroke="#0D9488" stroke-width="3"/>
  <line x1="72" y1="27" x2="80" y2="45" stroke="#0D9488" stroke-width="3"/>
  <circle cx="64" cy="48" r="4" fill="#0D9488"/>
  <circle cx="80" cy="48" r="4" fill="#0D9488"/>

  <!-- Center Lower Tree -->
  <circle cx="50" cy="52" r="6" fill="#0D9488"/>
  <line x1="50" y1="58" x2="38" y2="80" stroke="#0D9488" stroke-width="3.5"/>
  <line x1="50" y1="58" x2="62" y2="80" stroke="#0D9488" stroke-width="3.5"/>
  <circle cx="38" cy="83" r="5" fill="#0D9488"/>
  <circle cx="62" cy="83" r="5" fill="#0D9488"/>
</svg>
