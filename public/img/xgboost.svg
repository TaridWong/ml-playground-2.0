<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gradient Boosted Trees: Sequential trees connected by forward boosting arrow -->
  <!-- Tree 1 (Initial base tree) -->
  <circle cx="26" cy="30" r="4.5" fill="#f97316"/>
  <line x1="26" y1="34" x2="18" y2="48" stroke="#f97316" stroke-width="2.5"/>
  <line x1="26" y1="34" x2="34" y2="48" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="18" cy="50" r="3.5" fill="#f97316"/>
  <circle cx="34" cy="50" r="3.5" fill="#f97316"/>

  <!-- Stepping Plus / Residual Arrow -->
  <path d="M 40 40 L 52 40 M 47 35 L 53 40 L 47 45" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tree 2 (Residual correction tree) -->
  <circle cx="70" cy="24" r="5.5" fill="#f97316"/>
  <line x1="70" y1="29" x2="58" y2="48" stroke="#f97316" stroke-width="3"/>
  <line x1="70" y1="29" x2="82" y2="48" stroke="#f97316" stroke-width="3"/>
  <circle cx="58" cy="51" r="4" fill="#f97316"/>
  <circle cx="82" cy="51" r="4" fill="#f97316"/>

  <!-- Bottom Boost Lightning / Gradient Path -->
  <path d="M 20 78 L 45 68 L 52 74 L 80 62" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="80" cy="62" r="3.5" fill="#f97316"/>
</svg>
